name: Build

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  deployments: write

env:
  GOPRIVATE: go.devnw.com
  GH_ACCESS_TOKEN: ${{ secrets.GH_PAT }}

jobs:
  build:
    name: Lint, Build, Test, Benchmark
    if: ${{ ! startsWith(github.ref, 'refs/tags/v') }}
    uses: devnw/workflows/.github/workflows/nix.yml@main
    with:
      job: build
      command: make bench-ci
    secrets: inherit # pragma: allowlist secret
  release:
    name: Lint, Build, Test, Benchmark and Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    uses: devnw/workflows/.github/workflows/nix.yml@main
    with:
      job: release
      command: make release-ci
    secrets: inherit # pragma: allowlist secret
