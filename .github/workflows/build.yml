name: Build

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  deployments: write

env:
  GOPRIVATE: go.devnw.com
  GH_ACCESS_TOKEN: ${{ secrets.GH_PAT }}
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}

jobs:
  build:
    uses: devnw/workflows/.github/workflows/make-ci.yml@main
    secrets: inherit # pragma: allowlist secret
